name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cmd/banyan-engine
          - cmd/banyan-agent
          - cmd/banyan-cli
          - pkg/types
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Vet
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go vet ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cmd/banyan-engine
          - cmd/banyan-cli
          - pkg/types
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test with coverage
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.module }}/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cmd/banyan-engine
          - cmd/banyan-agent
          - cmd/banyan-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go build -o /dev/null .
