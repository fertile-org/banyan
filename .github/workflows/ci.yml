name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cmd/banyan-engine
          - cmd/banyan-agent
          - cmd/banyan-cli
          - pkg/types
          - pkg/rpc
          - pkg/storage
          - pkg/engine
          - pkg/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go mod download

      - name: Vet
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go vet ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cmd/banyan-engine
          - cmd/banyan-agent
          - cmd/banyan-cli
          - pkg/types
          - pkg/rpc
          - pkg/storage
          - pkg/engine
          - pkg/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go mod download

      - name: Test with coverage
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          # Exclude generated protobuf code (banyanpb) from coverage
          if [ "${{ matrix.module }}" = "pkg/rpc" ]; then
            go test -coverprofile=coverage.out -covermode=atomic -coverpkg=github.com/fertile-org/banyan/pkg/rpc ./...
          else
            go test -coverprofile=coverage.out -covermode=atomic ./...
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ matrix.module }}/coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - cmd/banyan-engine
          - cmd/banyan-agent
          - cmd/banyan-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build web dashboard
        if: matrix.module == 'cmd/banyan-cli'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Embed web dashboard in CLI
        if: matrix.module == 'cmd/banyan-cli'
        run: |
          cd web && npm ci && npm run build
          mkdir -p ../cmd/banyan-cli/webdist/static
          cp -r dist/* ../cmd/banyan-cli/webdist/static/

      - name: Download dependencies
        env:
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go mod download

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          cd ${{ matrix.module }}
          go build -o /dev/null .
