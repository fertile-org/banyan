name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOWORK: "off"
        run: |
          cd cmd/banyan-cli
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../../banyan-cli-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: banyan-cli-linux-${{ matrix.goarch }}
          path: banyan-cli-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum banyan-cli-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/banyan-cli-*
            dist/checksums.txt
            install.sh
