name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web dashboard
        run: |
          cd web
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  build:
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
        binary:
          - name: banyan-engine
            dir: cmd/banyan-engine
          - name: banyan-agent
            dir: cmd/banyan-agent
          - name: banyan-cli
            dir: cmd/banyan-cli
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Embed web dashboard in CLI
        if: matrix.binary.name == 'banyan-cli'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: cmd/banyan-cli/webdist/static/

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOWORK: "off"
        run: |
          cd ${{ matrix.binary.dir }}
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ../../${{ matrix.binary.name }}-linux-${{ matrix.goarch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary.name }}-linux-${{ matrix.goarch }}
          path: ${{ matrix.binary.name }}-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum banyan-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/banyan-*
            dist/checksums.txt
            install.sh
