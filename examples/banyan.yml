# Example Banyan deployment file
# Familiar docker-compose syntax with replicas for multi-server deployment
#
# Deploy: banyan-cli deploy -f examples/banyan.yml

name: my-app

services:
  api:
    build: ./api
    deploy:
      replicas: 3
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=banyan
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app
