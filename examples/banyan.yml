# Example Banyan deployment file
# Familiar docker-compose syntax with replicas for multi-server deployment
#
# Deploy: banyan-cli deploy -f examples/banyan.yml

name: my-app

services:
  web:
    build: ./web
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    build: ./api
    replicas: 3
    ports:
      - "8080:8080"
    env:
      - DB_HOST=my-app-db-0
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    replicas: 1
    ports:
      - "5432:5432"
    env:
      - POSTGRES_USER=banyan
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app
