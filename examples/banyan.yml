# Example Banyan deployment file
# Familiar docker-compose syntax with replicas for multi-server deployment

name: my-app

services:
  web:
    image: nginx:alpine
    replicas: 2
    ports:
      - "80:80"

  api:
    image: hashicorp/http-echo:latest
    replicas: 3
    ports:
      - "8080:8080"
    env:
      - LOG_LEVEL=info
      - DB_HOST=db.internal
    depends_on:
      - web
      - db

  db:
    image: postgres:15-alpine
    replicas: 1
    ports:
      - "5432:5432"
    env:
      - POSTGRES_USER=banyan
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app
