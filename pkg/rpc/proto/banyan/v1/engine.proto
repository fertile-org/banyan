syntax = "proto3";
package banyan.v1;
option go_package = "github.com/fertile-org/banyan/pkg/rpc/banyanpb";

// EngineService is hosted by the engine and called by agents and CLI.
service EngineService {
  // Agent RPCs
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc PollTasks(PollTasksRequest) returns (PollTasksResponse);
  rpc ReportTaskResult(ReportTaskResultRequest) returns (ReportTaskResultResponse);
  rpc ReportContainerHealth(ReportContainerHealthRequest) returns (ReportContainerHealthResponse);

  // CLI RPCs
  rpc Deploy(DeployRPCRequest) returns (DeployRPCResponse);
  rpc Down(DownRPCRequest) returns (DownRPCResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetLogs(GetLogsRequest) returns (stream GetLogsResponse);
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Scale(ScaleRequest) returns (ScaleResponse);

  // Operational RPCs (dashboard actions)
  rpc StopTask(StopTaskRequest) returns (StopTaskResponse);

  // Dashboard RPCs (monolithic — used by CLI TUI)
  rpc GetDashboardData(GetDashboardDataRequest) returns (GetDashboardDataResponse);

  // Web dashboard RPCs (per-page, lighter payloads)
  rpc GetClusterOverview(GetClusterOverviewRequest) returns (GetClusterOverviewResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  rpc GetDeploymentDetail(GetDeploymentDetailRequest) returns (GetDeploymentDetailResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // Secret RPCs
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}

message ScaleRequest {
  string name = 1;                      // deployment name
  map<string, int32> replicas = 2;      // service → target replica count
  repeated string tags = 3;
}

message ScaleResponse {
  string deployment_id = 1;
  map<string, int32> previous = 2;      // service → old count
  map<string, int32> current = 3;       // service → new count
}

// --- Shared messages ---

message SystemMetrics {
  double cpu_usage_ratio = 1;       // 0.0–1.0
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;
  uint64 disk_total_bytes = 5;
  uint32 cpu_cores = 6;
}

// --- Agent messages ---

message RegisterRequest {
  string agent_name = 1;
  string api_address = 2;
  string session_token = 3;
  repeated string tags = 4;
  string wg_public_key = 5;       // agent's WireGuard public key
  string host_ip = 6;             // agent's data-plane host IP (for overlay peer endpoint)
}

message RegisterResponse {
  string registry_url = 1;
  repeated string store_endpoints = 2 [deprecated = true];  // was etcd endpoints for Flannel
  string vpc_cidr = 3;                  // VPC network CIDR (e.g., "10.0.0.0/16")
  string allocated_subnet = 4;          // /24 subnet for this agent (e.g., "10.0.45.0/24")
  string overlay_type = 5 [deprecated = true];  // WireGuard is now the only overlay
  repeated ActiveContainer active_containers = 6;  // containers this agent should already be running
}

// ActiveContainer describes a container that was previously running on the agent.
// Returned during registration so the agent can restore proxy rules and tracking.
message ActiveContainer {
  string container_name = 1;
  string container_ip = 2;
  repeated string ports = 3;
  string service_name = 4;
  string deployment_id = 5;
  string task_id = 6;
}

message HeartbeatRequest {
  string agent_name = 1;
  string session_token = 2;
  repeated string tags = 3;
  SystemMetrics system_metrics = 4;     // agent system resource metrics
}

message HeartbeatResponse {
  repeated VPCPeer vpc_peers = 1;       // all other agents' network info
  repeated ServiceBackend service_backends = 2;  // all service backends cluster-wide
}

message VPCPeer {
  string subnet = 1;                    // peer's allocated subnet
  string host_ip = 2;                   // peer's reachable IP
  string vtep_mac = 3 [deprecated = true];  // VXLAN removed, WireGuard only
  string public_key = 4;               // WireGuard public key
}

message PollTasksRequest {
  string agent_name = 1;
}

message PollTasksResponse {
  repeated TaskRecord tasks = 1;
}

message ReportTaskResultRequest {
  string task_id = 1;
  string agent_id = 2;
  string status = 3;
  string error = 4;
  string container_name = 5;
  TaskResult result = 6;
}

message TaskResult {
  string container_id = 1;
}

message ReportTaskResultResponse {}

message ReportContainerHealthRequest {
  string agent_name = 1;
  repeated ContainerStatus containers = 2;
}

message ContainerStatus {
  string container_name = 1;
  string status = 2;
  string ip = 3;                              // container's overlay IP
  string health_status = 4;                   // "", "starting", "healthy", "unhealthy"
  double cpu_percent = 5;                     // 0.0-100.0 (from nerdctl stats)
  uint64 memory_used_bytes = 6;
  uint64 memory_limit_bytes = 7;
}

message ServiceBackend {
  string container_name = 1;
  string container_ip = 2;
  repeated string ports = 3;
  string agent_name = 4;
  string service_name = 5;
  string deployment_name = 6;
}

message ReportContainerHealthResponse {}

message TaskRecord {
  string id = 1;
  string deployment_id = 2;
  string service_name = 3;
  int32 replica_index = 4;
  string agent_id = 5;
  string type = 6;
  string status = 7;
  string image = 8;
  string container_name = 9;
  repeated string ports = 10;
  repeated string environment = 11;
  repeated string command = 12;
  string restart = 13;
  repeated string entrypoint = 14;
  string memory_limit = 15;
  string cpu_limit = 16;
  string memory_reservation = 17;
  ManifestHealthcheck healthcheck = 18;
  string deployment_name = 19;
  repeated VolumeMount volumes = 20;
  repeated string secret_refs = 21;            // secret names (stored in etcd)
  map<string, string> resolved_secrets = 22;   // decrypted values (populated at PollTasks time, never stored)
}

// --- CLI messages ---

message DeployRPCRequest {
  Manifest manifest = 1;
  repeated string services = 2;  // optional: deploy only these services
  repeated string tags = 3;      // optional: deployment tags for agent matching
}

message DeployRPCResponse {
  string deployment_id = 1;
  string status = 2;
}

message Manifest {
  string name = 1;
  string version = 2;
  map<string, ManifestService> services = 3;
  map<string, VolumeConfig> volumes = 4;
}

message ManifestService {
  string image = 1;
  ManifestBuild build = 2;
  ManifestDeploy deploy = 3;
  repeated string ports = 4;
  repeated string environment = 5;
  repeated string command = 6;
  map<string, DependsOnCondition> depends_on = 7;
  string restart = 8;
  repeated string entrypoint = 9;
  ManifestHealthcheck healthcheck = 10;
  repeated VolumeMount volumes = 11;
  repeated string secrets = 12;        // secret names to inject as env vars
}

message VolumeMount {
  string type = 1;
  string source = 2;
  string target = 3;
  bool read_only = 4;
  TmpfsOpt tmpfs = 5;
}

message TmpfsOpt {
  string size = 1;
}

message VolumeConfig {
  string driver = 1;
  map<string, string> driver_opts = 2;
  bool external = 3;
  string name = 4;
}

message DependsOnCondition {
  string condition = 1;  // "service_started" or "service_healthy"
}

message ManifestHealthcheck {
  repeated string test = 1;
  string interval = 2;
  string timeout = 3;
  int32 retries = 4;
  string start_period = 5;
  bool disable = 6;
}

message ManifestBuild {
  string context = 1;
  string dockerfile = 2;
}

message ManifestDeploy {
  int32 replicas = 1;
  ManifestPlacement placement = 2;
  ManifestResources resources = 3;
  ManifestAutoscale autoscale = 4;
  string stop_grace_period = 5;
}

message ManifestAutoscale {
  int32 min = 1;
  int32 max = 2;
  int32 target_cpu = 3;      // percent (e.g., 70)
  string cooldown = 4;       // duration (e.g., "60s")
}

message ManifestResources {
  ResourceSpec limits = 1;
  ResourceSpec reservations = 2;
}

message ResourceSpec {
  string memory = 1;
  string cpus = 2;
}

message ManifestPlacement {
  string node = 1;
}

message DownRPCRequest {
  string name = 1;
  repeated string services = 2;
  repeated string tags = 3;
}

message DownRPCResponse {
  int32 task_count = 1;
}

message GetStatusRequest {}

message GetStatusResponse {
  repeated AgentInfo agents = 1;
  repeated DeploymentInfo deployments = 2;
}

message AgentInfo {
  string name = 1;
  string status = 2;
  string api_address = 3;
  int64 last_seen_unix = 4;
  int64 created_at_unix = 5;
  repeated string tags = 6;
}

message DeploymentInfo {
  string id = 1;
  string name = 2;
  string status = 3;
  map<string, ServiceInfo> services = 4;
  int64 created_at_unix = 5;
  int64 updated_at_unix = 6;
  string error = 7;
  repeated TaskInfo tasks = 8;
  int32 healthy = 9;
  int32 total = 10;
  repeated string tags = 11;
}

message ServiceInfo {
  string image = 1;
  int32 replicas = 2;
  repeated string ports = 3;
  repeated string environment = 4;
  repeated string command = 5;
  map<string, DependsOnCondition> depends_on = 6;
}

message TaskInfo {
  string id = 1;
  string deployment_id = 2;
  string service_name = 3;
  int32 replica_index = 4;
  string agent_id = 5;
  string type = 6;
  string status = 7;
  string image = 8;
  string container_name = 9;
  repeated string ports = 10;
  repeated string environment = 11;
  repeated string command = 12;
  string container_status = 13;
  int64 container_checked_at_unix = 14;
  int64 created_at_unix = 15;
  int64 updated_at_unix = 16;
  string error = 17;
  string health_status = 18;
  double cpu_percent = 19;          // 0.0-100.0 (from container stats)
  uint64 memory_used_bytes = 20;
  uint64 memory_limit_bytes = 21;
}

message GetLogsRequest {
  string container_name = 1;
  bool follow = 2;
  int32 tail = 3;
}

message GetLogsResponse {
  bytes data = 1;
}

message GetInfoRequest {}

message GetInfoResponse {
  string registry_url = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

// --- Dashboard messages ---

message GetDashboardDataRequest {}

message GetDashboardDataResponse {
  EngineStatus engine = 1;
  repeated AgentDetail agents = 2;
  repeated DeploymentInfo deployments = 3;
  ClusterSummary summary = 4;
  repeated ClusterEvent recent_events = 5;
}

message EngineStatus {
  string status = 1;
  int64 started_at_unix = 2;
  SystemMetrics system_metrics = 3;
}

message AgentDetail {
  string name = 1;
  string status = 2;
  string api_address = 3;
  int64 last_seen_unix = 4;
  int64 created_at_unix = 5;
  repeated string tags = 6;
  SystemMetrics system_metrics = 7;
  string vpc_subnet = 8;
  int32 container_count = 9;
}

message ClusterSummary {
  int32 total_agents = 1;
  int32 connected_agents = 2;
  int32 total_deployments = 3;
  int32 running_deployments = 4;
  int32 total_containers = 5;
  int32 healthy_containers = 6;
  map<string, int32> tasks_by_status = 7;
}

message ClusterEvent {
  int64 timestamp_unix = 1;
  string type = 2;
  string message = 3;
  string severity = 4;
}

// --- Secret messages ---

message CreateSecretRequest {
  string name = 1;
  bytes value = 2;
}
message CreateSecretResponse {}

message ListSecretsRequest {}
message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}

message SecretInfo {
  string name = 1;
  string created_at = 2;
  string updated_at = 3;
}

message GetSecretRequest {
  string name = 1;
  bool reveal = 2;
}
message GetSecretResponse {
  string name = 1;
  string created_at = 2;
  string updated_at = 3;
  bytes value = 4;   // only populated if reveal=true
}

message DeleteSecretRequest {
  string name = 1;
}
message DeleteSecretResponse {}

// --- StopTask (operational) ---

message StopTaskRequest {
  string task_id = 1;    // ID of the create_and_start task to stop
  string agent_id = 2;   // agent running the container
}
message StopTaskResponse {
  string stop_task_id = 1; // ID of the created stop_and_remove task
  string status = 2;       // "stopping"
}

// --- Web dashboard page-level RPCs ---

message GetClusterOverviewRequest {}
message GetClusterOverviewResponse {
  EngineStatus engine = 1;
  ClusterSummary summary = 2;
  repeated ClusterEvent recent_events = 3;
}

message ListAgentsRequest {}
message ListAgentsResponse {
  repeated AgentDetail agents = 1;
}

message ListDeploymentsRequest {}
message ListDeploymentsResponse {
  repeated DeploymentInfo deployments = 1;  // tasks omitted for list view
}

message GetDeploymentDetailRequest {
  string id = 1;
}
message GetDeploymentDetailResponse {
  DeploymentInfo deployment = 1;  // includes full task list
}

message ListContainersRequest {}
message ListContainersResponse {
  repeated ContainerInfo containers = 1;
}

// ContainerInfo is a flat container view for the web dashboard.
// Derived from create_and_start tasks in the latest deployment per name.
message ContainerInfo {
  string task_id = 1;
  string container_name = 2;
  string service_name = 3;
  int32 replica_index = 4;
  string agent_id = 5;
  string deployment_name = 6;
  string deployment_id = 7;
  string image = 8;
  string container_status = 9;
  string health_status = 10;
  repeated string ports = 11;
  double cpu_percent = 12;
  uint64 memory_used_bytes = 13;
  uint64 memory_limit_bytes = 14;
  int64 created_at_unix = 15;
  int64 updated_at_unix = 16;
  string error = 17;
}

message ListEventsRequest {
  int32 limit = 1;  // 0 = default (50)
}
message ListEventsResponse {
  repeated ClusterEvent events = 1;
}
