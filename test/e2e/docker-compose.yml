version: '3.8'

# Banyan E2E Test Environment
# 1 Engine + 2 Agents
#
# Pre-requisite: Build binaries first (see run-e2e.sh)

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banyan-engine
    hostname: engine
    privileged: true
    command: ["/entrypoint-engine.sh"]
    environment:
      - E2E_PASSWORD=banyan-e2e-secret
    ports:
      - "2379:2379"
      - "50051:50051"
    networks:
      banyan-net:
        ipv4_address: 172.28.0.10
    volumes:
      - engine-data:/var/lib/banyan
      - ./examples:/examples:ro
    healthcheck:
      test: ["CMD", "banyan-cli", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banyan-worker-1
    hostname: worker-1
    privileged: true
    command: ["/entrypoint-agent.sh"]
    environment:
      - NODE_NAME=worker-1
      - ENGINE_HOST=engine
      - ENGINE_GRPC_PORT=50051
      - E2E_PASSWORD=banyan-e2e-secret
    networks:
      banyan-net:
        ipv4_address: 172.28.0.11
    volumes:
      - worker1-data:/var/lib/banyan
      - worker1-containerd:/var/lib/containerd
    depends_on:
      engine:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banyan-worker-2
    hostname: worker-2
    privileged: true
    command: ["/entrypoint-agent.sh"]
    environment:
      - NODE_NAME=worker-2
      - ENGINE_HOST=engine
      - ENGINE_GRPC_PORT=50051
      - E2E_PASSWORD=banyan-e2e-secret
    networks:
      banyan-net:
        ipv4_address: 172.28.0.12
    volumes:
      - worker2-data:/var/lib/banyan
      - worker2-containerd:/var/lib/containerd
    depends_on:
      engine:
        condition: service_healthy

networks:
  banyan-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  engine-data:
  worker1-data:
  worker1-containerd:
  worker2-data:
  worker2-containerd:
