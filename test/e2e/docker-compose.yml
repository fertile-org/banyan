version: '3.8'

# Banyan E2E Test Environment
# 1 Engine + 2 Agents
#
# Pre-requisite: Build banyan-cli binary first:
#   cd cmd/banyan-cli && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../../test/e2e/bin/banyan-cli .

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banyan-engine
    hostname: engine
    privileged: true
    command: ["/entrypoint-engine.sh"]
    ports:
      - "2379:2379"
    networks:
      banyan-net:
        ipv4_address: 172.28.0.10
    volumes:
      - engine-data:/var/lib/banyan
      - ./examples:/examples:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:2379/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banyan-worker-1
    hostname: worker-1
    privileged: true
    command: ["/entrypoint-agent.sh"]
    environment:
      - NODE_NAME=worker-1
      - ENGINE_ENDPOINT=http://engine:2379
    networks:
      banyan-net:
        ipv4_address: 172.28.0.11
    volumes:
      - worker1-data:/var/lib/banyan
      - worker1-containerd:/var/lib/containerd
    depends_on:
      engine:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banyan-worker-2
    hostname: worker-2
    privileged: true
    command: ["/entrypoint-agent.sh"]
    environment:
      - NODE_NAME=worker-2
      - ENGINE_ENDPOINT=http://engine:2379
    networks:
      banyan-net:
        ipv4_address: 172.28.0.12
    volumes:
      - worker2-data:/var/lib/banyan
      - worker2-containerd:/var/lib/containerd
    depends_on:
      engine:
        condition: service_healthy

networks:
  banyan-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  engine-data:
  worker1-data:
  worker1-containerd:
  worker2-data:
  worker2-containerd:
