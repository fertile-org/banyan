# Banyan E2E Test Application
# A simple multi-service application for testing

name: e2e-test-app

services:
  # Simple web server
  web:
    image: nginx:alpine
    replicas: 2
    ports:
      - "80:80"

  # API service
  api:
    image: alpine:latest
    replicas: 2
    command:
      - sh
      - -c
      - "echo 'API running' && sleep infinity"
    env:
      - APP_ENV=test
      - LOG_LEVEL=debug
    depends_on:
      - web

  # Background worker
  worker:
    image: alpine:latest
    replicas: 1
    command:
      - sh
      - -c
      - "echo 'Worker running' && sleep infinity"
    env:
      - WORKER_ID=1
