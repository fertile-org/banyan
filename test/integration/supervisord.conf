[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:containerd]
command=/usr/bin/containerd
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/containerd.log
stderr_logfile=/var/log/containerd.err.log
startsecs=3

[program:etcd]
command=/usr/local/bin/etcd --data-dir=/var/lib/etcd --listen-client-urls=http://0.0.0.0:2379 --advertise-client-urls=http://127.0.0.1:2379
autostart=false
autorestart=true
priority=20
stdout_logfile=/var/log/etcd.log
stderr_logfile=/var/log/etcd.err.log
startsecs=3

[program:flanneld]
command=/usr/local/bin/flanneld --etcd-endpoints=http://127.0.0.1:2379 --iface=eth0 --subnet-file=/run/flannel/subnet.env
autostart=false
autorestart=true
priority=30
stdout_logfile=/var/log/flanneld.log
stderr_logfile=/var/log/flanneld.err.log
startsecs=3
startretries=5
